<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proba sunet – pantof / nufăr</title>
<style>
  body { font: 20px sans-serif; background: #eaf6fc; color: #0d4f86; margin: 0; padding: 16px; }
  h1 { font-size: 22px; } p { font-size: 16px; }
  button { display: block; width: 100%; max-width: 420px; margin: 10px 0; padding: 16px; font: 700 24px sans-serif; color: #fff; background: #2f9be0; border: 0; border-radius: 16px; }
  button.n { background: #e07b2f; }
</style></head><body>
<h1>Proba sunet (doar pentru Ema)</h1>
<p>Apasă pe fiecare buton și ascultă. Sunt exact fișierele pe care le folosește jocul.</p>
<button data-f="res/15c264e79f1abbd5.mp3">PAN</button>
<button data-f="res/7cb009b61f181fec.mp3">TOF</button>
<button data-l="res/15c264e79f1abbd5.mp3,res/7cb009b61f181fec.mp3">PAN – TOF (ca în joc)</button>
<button class="n" data-f="res/0bbd02fe961cb251.mp3">NU</button>
<button class="n" data-f="res/e524afdc055db915.mp3">FĂR</button>
<button class="n" data-l="res/0bbd02fe961cb251.mp3,res/e524afdc055db915.mp3">NU – FĂR (ca în joc)</button>
<script>
let a = null;
const canta = (lista, i = 0) => { if (i >= lista.length) return; if (a) a.pause(); a = new Audio(lista[i]); a.play(); setTimeout(() => canta(lista, i + 1), 1150); };
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => canta((b.dataset.f || b.dataset.l).split(','))));
</script>
</body></html>
